[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200

lib_deps = 
    m5stack/M5Core2@^0.1.7
    Wire
    WiFi
    HTTPClient

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

upload_speed = 921600
monitor_filters = esp32_exception_decoder